version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/landing-page"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "@vitejs/plugin-react"]
      lint:
        patterns: ["eslint*", "@eslint/*", "globals"]
      build:
        patterns: ["vite", "vitest", "postcss*"]
    ignore:
      # eslint-plugin-react declares peer support up to ESLint 9
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
